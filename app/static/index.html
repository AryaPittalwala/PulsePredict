<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PulsePredict – NSE Intraday Intelligence</title>
  <!-- Keep the application self-contained: blocked CDNs previously left #root empty. -->
  <script src="/static/vendor/babel.min.js"></script>
  <script src="/static/vendor/react.production.min.js"></script>
  <script src="/static/vendor/react-dom.production.min.js"></script>
  <script src="/static/vendor/plotly.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,700;0,800;1,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #09090b;
      --bg-card: #111117;
      --bg-card-hover: #17171f;
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.14);
      --text: #f4f4f5;
      --text-muted: #71717a;
      --text-dim: #3f3f46;
      --green: #22c55e;
      --green-dim: rgba(34,197,94,0.12);
      --green-glow: rgba(34,197,94,0.25);
      --red: #ef4444;
      --red-dim: rgba(239,68,68,0.12);
      --amber: #f59e0b;
      --blue: #3b82f6;
      --blue-dim: rgba(59,130,246,0.12);
      --purple: #a855f7;
      --purple-dim: rgba(168,85,247,0.12);
      --accent: #e2e8f0;
      --radius: 16px;
      --radius-sm: 10px;
      --radius-xs: 6px;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    #root { min-height: 100vh; }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg); }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }

    /* Animations */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.5; transform: scale(0.8); }
    }
    @keyframes ticker-scroll {
      0%   { transform: translateX(0); }
      100% { transform: translateX(-50%); }
    }
    @keyframes shimmer {
      0%   { background-position: -200% 0; }
      100% { background-position:  200% 0; }
    }
    @keyframes glow-pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(34,197,94,0.1); }
      50%       { box-shadow: 0 0 40px rgba(34,197,94,0.25); }
    }

    .fade-up { animation: fadeUp 0.6s ease both; }
    .fade-up-delay-1 { animation: fadeUp 0.6s 0.1s ease both; }
    .fade-up-delay-2 { animation: fadeUp 0.6s 0.2s ease both; }
    .fade-up-delay-3 { animation: fadeUp 0.6s 0.3s ease both; }

    /* Gradient text */
    .gradient-text {
      background: linear-gradient(135deg, #f4f4f5 0%, #a1a1aa 60%, #71717a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .gradient-green {
      background: linear-gradient(135deg, #4ade80 0%, #22c55e 50%, #16a34a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Nav */
    .nav {
      position: fixed; top: 12px; left: 24px; right: 24px; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px 0 19px;
      height: 60px; border-radius: 18px;
      background: linear-gradient(120deg, rgba(15,23,42,0.84), rgba(11,14,24,0.67) 48%, rgba(17,24,39,0.77));
      backdrop-filter: blur(24px) saturate(175%);
      -webkit-backdrop-filter: blur(24px) saturate(175%);
      border: 1px solid rgba(148,163,184,0.18);
      box-shadow: 0 16px 42px rgba(0,0,0,0.28), inset 0 1px 0 rgba(255,255,255,0.075);
    }
    .nav::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: linear-gradient(105deg, rgba(59,130,246,0.10), transparent 33%, transparent 70%, rgba(34,197,94,0.055)); }
    .nav-logo {
      position: relative; display: flex; align-items: center; gap: 10px;
      font-size: 17px; font-weight: 800; letter-spacing: -0.6px; cursor: pointer;
    }
    .nav-logo-dot {
      width: 8px; height: 8px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse-dot 2s ease-in-out infinite;
      box-shadow: 0 0 12px var(--green);
    }
    .nav-links { position: relative; display: flex; align-items: center; gap: 6px; }
    .nav-link {
      padding: 8px 12px; color: #a1a1aa;
      font-size: 12px; font-weight: 600; letter-spacing: .01em;
      border-radius: 9px;
      cursor: pointer; transition: all 0.2s;
      border: none; background: none;
    }
    .nav-link:hover { color: #eff6ff; background: rgba(59,130,246,0.12); box-shadow: inset 0 0 0 1px rgba(96,165,250,0.13); }
    .nav-cta {
      padding: 9px 16px; margin-left: 4px;
      background: linear-gradient(135deg, #dbeafe, #93c5fd);
      color: #0f172a; font-size: 12px; font-weight: 800;
      border-radius: 10px; cursor: pointer; transition: all 0.2s; border: none;
      box-shadow: 0 5px 18px rgba(59,130,246,0.20);
    }
    .nav-cta:hover { transform: translateY(-1px); background: #eff6ff; box-shadow: 0 8px 24px rgba(59,130,246,0.32); }

    /* Market status pill */
    .market-pill {
      display: flex; align-items: center; gap: 7px;
      padding: 6px 11px; margin-right: 5px;
      background: rgba(2,6,23,0.38);
      border: 1px solid rgba(148,163,184,0.14);
      border-radius: 20px;
      font-size: 12px; font-weight: 500;
      color: var(--text-muted);
    }
    @media (max-width: 680px) { .nav { left: 10px; right: 10px; top: 8px; padding: 0 10px; } .market-pill { display: none; } .nav-link { display: none; } .nav-cta { padding: 8px 11px; } }
    .market-pill-dot {
      width: 7px; height: 7px; border-radius: 50%;
      animation: pulse-dot 1.5s ease-in-out infinite;
    }

    /* Ticker tape */
    .ticker-tape {
      display: flex; align-items: center; gap: 16px;
      background: linear-gradient(90deg, rgba(10,15,27,0.94), rgba(17,17,29,0.82), rgba(10,15,27,0.94));
      border-bottom: 1px solid var(--border);
      padding: 12px 32px;
    }
    .ticker-viewport { flex: 1; overflow: hidden; position: relative; mask-image: linear-gradient(90deg, transparent, black 4%, black 96%, transparent); }
    .ticker-viewport::before, .ticker-viewport::after { content: ''; position: absolute; z-index: 1; top: 0; bottom: 0; width: 42px; pointer-events: none; }
    .ticker-viewport::before { left: 0; background: linear-gradient(90deg, rgba(10,15,27,0.88), transparent); }
    .ticker-viewport::after { right: 0; background: linear-gradient(270deg, rgba(10,15,27,0.88), transparent); }
    .ticker-inner {
      display: flex; align-items: center;
      width: max-content;
      will-change: transform; animation: ticker-scroll 38s linear infinite;
    }
    .ticker-tape:hover .ticker-inner { animation-play-state: paused; }
    .ticker-label {
      flex: 0 0 auto; color: #93c5fd; font-size: 10px;
      font-weight: 800; letter-spacing: 0.09em; text-transform: uppercase;
      padding: 5px 10px; border: 1px solid rgba(59,130,246,0.25); border-radius: 999px; background: rgba(59,130,246,0.08);
    }
    .ticker-group { display: flex; align-items: center; gap: 10px; padding-right: 10px; }
    .ticker-item {
      flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
      padding: 7px 11px; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; background: rgba(255,255,255,0.02);
      font-size: 12px; font-weight: 500; cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .ticker-item:hover { border-color: rgba(59,130,246,0.48); background: rgba(59,130,246,0.08); }
    .ticker-loading { color: var(--text-muted); font-size: 12px; }

    /* Landing atmosphere */
    .landing-shell {
      position: relative; isolation: isolate; overflow: hidden;
      background:
        radial-gradient(ellipse 70% 42% at 50% 2%, rgba(59,130,246,0.15), transparent 70%),
        radial-gradient(ellipse 45% 28% at 7% 34%, rgba(99,102,241,0.10), transparent 75%),
        radial-gradient(ellipse 45% 30% at 96% 67%, rgba(34,197,94,0.07), transparent 76%),
        #09090b;
    }
    .landing-shell > * { position: relative; z-index: 1; }
    .landing-shell::before {
      content: ''; position: absolute; z-index: 0; inset: 0;
      background-image: linear-gradient(rgba(148,163,184,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,0.045) 1px, transparent 1px);
      background-size: 52px 52px; mask-image: linear-gradient(to bottom, black 0%, transparent 48%);
      pointer-events: none;
    }
    .landing-shell::after {
      content: ''; position: absolute; z-index: 0; width: 620px; height: 620px; top: 330px; left: 50%; transform: translateX(-50%);
      border: 1px solid rgba(59,130,246,0.12); border-radius: 50%;
      box-shadow: 0 0 0 80px rgba(59,130,246,0.025), 0 0 0 160px rgba(59,130,246,0.018);
      pointer-events: none;
    }

    /* Prediction terminal */
    .prediction-shell {
      min-height: 100vh; padding-top: 84px; position: relative; overflow: hidden;
      background: radial-gradient(ellipse at 12% 2%, rgba(59,130,246,0.16), transparent 31%),
        radial-gradient(ellipse at 88% 22%, rgba(99,102,241,0.13), transparent 30%), #080b14;
    }
    .prediction-toolbar {
      position: relative; z-index: 1; padding: 24px 32px;
      background: rgba(12,13,20,0.54); border-bottom: 1px solid rgba(255,255,255,0.07);
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    }
    .prediction-toolbar-inner { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
    .prediction-back { color: var(--text-muted); background: rgba(255,255,255,0.035); border: 1px solid var(--border); border-radius: 10px; cursor: pointer; font-size: 12px; padding: 8px 11px; }
    .prediction-title { font-size: 30px; font-weight: 900; letter-spacing: -1.3px; line-height: 1; }
    .prediction-subtitle { color: var(--text-muted); font-size: 13px; margin-top: 7px; }
    .prediction-controls { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }
    .glass-control { background: rgba(8,9,13,0.62); border: 1px solid rgba(255,255,255,0.10); border-radius: 10px; color: var(--text); font: 500 13px Inter, sans-serif; }
    .prediction-layout { max-width: 1240px; margin: 0 auto; padding: 30px 32px 64px; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 22px; position: relative; z-index: 1; }
    .prediction-card { background: linear-gradient(145deg, rgba(23,25,35,0.82), rgba(13,14,20,0.72)); border: 1px solid rgba(255,255,255,0.09); box-shadow: 0 20px 60px rgba(0,0,0,0.20), inset 0 1px 0 rgba(255,255,255,0.035); }
    .chart-card { padding: 22px; border-radius: 20px; }
    .forecast-card { padding: 26px; border-radius: 20px; position: sticky; top: 84px; overflow: hidden; }
    .forecast-card::before { content: ''; position: absolute; width: 190px; height: 190px; top: -100px; right: -80px; background: radial-gradient(circle, rgba(59,130,246,0.25), transparent 68%); pointer-events: none; }
    .section-kicker { color: var(--text-muted); font-size: 10px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
    .chart-heading { font-size: 16px; font-weight: 800; letter-spacing: -0.3px; }
    .stock-overview { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 20px; align-items: end; width: 100%; }
    .stock-overview .stock-symbol { color: #93c5fd; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .stock-overview .stock-name { color: #f8fafc; font-size: 24px; font-weight: 800; letter-spacing: -.8px; margin-top: 6px; }
    .stock-overview .stock-price { color: #f8fafc; font-size: 34px; font-weight: 850; letter-spacing: -1.4px; margin-top: 12px; }
    .stock-overview .stock-change { font-size: 13px; font-weight: 700; margin-left: 8px; }
    .ohlc-strip { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; color: #94a3b8; font-size: 11px; }
    .ohlc-strip b { color: #e2e8f0; font-size: 12px; margin-left: 4px; }
    .chart-periods { display: flex; border-top: 1px solid rgba(255,255,255,.08); margin-top: 10px; padding-top: 14px; gap: 8px; flex-wrap: wrap; }
    .period-chip { border: 1px solid rgba(148,163,184,.22); border-radius: 999px; background: rgba(15,23,42,.5); color: #94a3b8; padding: 6px 11px; font: 600 11px Inter, sans-serif; }
    .period-chip.active { color: #dbeafe; border-color: #3b82f6; background: rgba(59,130,246,.17); }
    .blue-accent .pred-up { color: var(--green); background: var(--green-dim); border-color: rgba(34,197,94,.38); }
    @media (max-width: 900px) { .prediction-layout { grid-template-columns: 1fr; padding: 18px; } .forecast-card { position: static; } .prediction-toolbar { padding: 18px; } .prediction-controls { margin-left: 0; width: 100%; } }
    .ticker-name { color: var(--text-muted); }
    .ticker-price { color: var(--text); }
    .ticker-change-pos { color: var(--green); }
    .ticker-change-neg { color: var(--red); }

    /* Hero */
    .hero {
      padding: 160px 32px 100px;
      max-width: 1200px;
      margin: 0 auto;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(59,130,246,0.13) 0%, rgba(34,197,94,0.035) 42%, transparent 70%);
      pointer-events: none;
    }
    .hero::before { z-index: 0; }
    .hero > :not(.hero-sparkline) { position: relative; z-index: 1; }
    .hero-sparkline {
      position: absolute; z-index: 0; left: 50%; bottom: 8px; transform: translateX(-50%);
      width: min(860px, 92%); height: 230px; opacity: 0.32; pointer-events: none;
      mask-image: linear-gradient(to bottom, transparent, black 24%, black 78%, transparent);
    }
    .hero-sparkline .spark-grid { stroke: rgba(74,222,128,0.22); stroke-width: 1; stroke-dasharray: 4 8; }
    .hero-sparkline .spark-fill { fill: url(#heroSparkFill); }
    .hero-sparkline .spark-line { fill: none; stroke: #4ade80; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 8px rgba(34,197,94,.8)); }
    .hero-sparkline .spark-dot { fill: #86efac; filter: drop-shadow(0 0 8px #22c55e); }
    .hero-eyebrow {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      background: rgba(34,197,94,0.08);
      border: 1px solid rgba(34,197,94,0.2);
      border-radius: 20px;
      font-size: 12px; font-weight: 600;
      color: var(--green);
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .hero-title {
      font-size: clamp(48px, 7vw, 88px);
      font-weight: 900;
      letter-spacing: -3px;
      line-height: 0.95;
      margin-bottom: 28px;
    }
    .hero-title-serif {
      font-family: 'Playfair Display', serif;
      font-style: italic;
    }
    .hero-subtitle {
      font-size: 18px;
      color: var(--text-muted);
      max-width: 560px;
      margin: 0 auto 48px;
      line-height: 1.65;
      font-weight: 400;
    }
    .hero-actions { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
    .btn-primary {
      padding: 14px 28px;
      background: var(--text);
      color: var(--bg);
      font-size: 15px; font-weight: 700;
      border-radius: var(--radius-sm);
      cursor: pointer; transition: all 0.2s;
      border: none; display: flex; align-items: center; gap: 8px;
    }
    .btn-primary:hover { background: #d4d4d8; transform: translateY(-1px); }
    .btn-outline {
      padding: 14px 28px;
      background: transparent;
      color: var(--text-muted);
      font-size: 15px; font-weight: 500;
      border-radius: var(--radius-sm);
      cursor: pointer; transition: all 0.2s;
      border: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .btn-outline:hover { border-color: var(--border-hover); color: var(--text); background: rgba(255,255,255,0.03); }

    /* Stats strip */
    .stats-strip {
      display: flex; align-items: center; justify-content: center;
      gap: 48px; flex-wrap: wrap;
      padding: 40px 32px;
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.01);
    }
    .stat-item { text-align: center; }
    .stat-number { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
    .stat-label { font-size: 12px; color: var(--text-muted); font-weight: 500; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

    /* Section */
    .section { padding: 80px 32px; max-width: 1200px; margin: 0 auto; }
    .section-label {
      font-size: 11px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--text-muted);
      margin-bottom: 16px;
    }
    .section-title {
      font-size: clamp(32px, 4vw, 52px);
      font-weight: 900; letter-spacing: -1.5px;
      line-height: 1.05; margin-bottom: 16px;
    }
    .section-desc { font-size: 17px; color: var(--text-muted); max-width: 480px; line-height: 1.65; }

    /* Bento grid */
    .bento {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      gap: 16px;
      margin-top: 48px;
    }
    .bento-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .bento-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    }
    .bento-card:hover {
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
      transform: translateY(-2px);
    }
    .bento-col-7  { grid-column: span 7; }
    .bento-col-5  { grid-column: span 5; }
    .bento-col-4  { grid-column: span 4; }
    .bento-col-3  { grid-column: span 3; }
    .bento-col-6  { grid-column: span 6; }
    .bento-col-8  { grid-column: span 8; }
    .bento-col-12 { grid-column: span 12; }
    @media (max-width: 900px) {
      .bento-col-7, .bento-col-5, .bento-col-4, .bento-col-3, .bento-col-6, .bento-col-8 { grid-column: span 12; }
    }

    /* Card elements */
    .card-tag {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 20px;
    }
    .tag-green  { background: var(--green-dim);  color: var(--green); border: 1px solid rgba(34,197,94,0.2); }
    .tag-red    { background: var(--red-dim);    color: var(--red);   border: 1px solid rgba(239,68,68,0.2); }
    .tag-blue   { background: var(--blue-dim);   color: var(--blue);  border: 1px solid rgba(59,130,246,0.2); }
    .tag-purple { background: var(--purple-dim); color: var(--purple);border: 1px solid rgba(168,85,247,0.2); }
    .tag-amber  { background: rgba(245,158,11,0.1); color: var(--amber); border: 1px solid rgba(245,158,11,0.2); }

    .card-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
    .card-desc  { font-size: 14px; color: var(--text-muted); line-height: 1.6; }

    /* Stock row in movers card */
    .stock-row {
      display: flex; align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      gap: 12px;
    }
    .stock-row:last-child { border-bottom: none; }
    .stock-ticker { font-size: 13px; font-weight: 700; min-width: 90px; }
    .stock-name { font-size: 12px; color: var(--text-muted); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .stock-price { font-size: 13px; font-weight: 600; }
    .stock-chg {
      font-size: 12px; font-weight: 700;
      padding: 3px 8px; border-radius: 4px;
      min-width: 64px; text-align: center;
    }
    .chg-pos { background: var(--green-dim); color: var(--green); }
    .chg-neg { background: var(--red-dim); color: var(--red); }

    /* Mini sparkline SVG */
    .sparkline-wrap { flex-shrink: 0; }

    /* Prediction pill */
    .pred-badge {
      display: inline-flex; align-items: center; gap: 7px;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 15px; font-weight: 800;
      letter-spacing: 0.5px;
    }
    .pred-up      { background: var(--green-dim); color: var(--green); border: 1px solid rgba(34,197,94,0.3); }
    .pred-down    { background: var(--red-dim);   color: var(--red);   border: 1px solid rgba(239,68,68,0.3); }
    .pred-neutral { background: rgba(255,255,255,0.05); color: #a1a1aa; border: 1px solid rgba(255,255,255,0.1); }

    /* Probability bar */

<body>
<div id="root" aria-live="polite">Loading PulsePredict…</div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ── Tiny fetch helper ──────────────────────────────────────────────────────
async function api(path) {
  const res = await fetch(path);
  if (!res.ok) throw new Error(`API ${path} → ${res.status}`);
  return res.json();
}

// ── Mini SVG Sparkline ─────────────────────────────────────────────────────
function Sparkline({ data = [], positive = true, width = 100, height = 36 }) {
  if (!data || data.length < 2) return null;
  const mn = Math.min(...data), mx = Math.max(...data);
  const rng = mx - mn || 1;
  const pad = 3;
  const pts = data.map((v, i) => {
    const x = pad + (i / (data.length - 1)) * (width - pad * 2);
    const y = (height - pad) - ((v - mn) / rng) * (height - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const color = positive ? "#22c55e" : "#ef4444";
  const lastPt = pts.split(" ").pop().split(",");
  return (
    <svg width={width} height={height} viewBox={`0 0 ${width} ${height}`}>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />
      <circle cx={lastPt[0]} cy={lastPt[1]} r="2.5" fill={color} />
    </svg>
  );
}

// ── Market Status Pill ─────────────────────────────────────────────────────
function MarketPill({ status }) {
  const isOpen = status?.is_open;
  return (
    <div className="market-pill">
      <span className="market-pill-dot" style={{ background: isOpen ? "#22c55e" : "#71717a" }} />
      <span>NSE {status?.status || "—"}</span>
      <span style={{ color: "#52525b" }}>·</span>
      <span>{status?.time || "..."}</span>
    </div>
  );
}

// ── Navbar ─────────────────────────────────────────────────────────────────
function Nav({ status, onNavigate }) {
  return (
    <nav className="nav">
      <div className="nav-logo" onClick={() => onNavigate("landing")}>
        <span className="nav-logo-dot" />
        <span>PulsePredict</span>
      </div>
      <div className="nav-links">
        <MarketPill status={status} />
        <button className="nav-link" onClick={() => onNavigate("predict")}>Predict</button>
        <button className="nav-link" onClick={() => onNavigate("scoreboard")}>Scoreboard</button>
        <button className="nav-cta" onClick={() => onNavigate("predict")}>Try it free →</button>
      </div>
    </nav>
  );
}

// ── Ticker Tape ────────────────────────────────────────────────────────────
function TickerTape({ movers, onSelect }) {
  const items = [...(movers?.gainers || []), ...(movers?.losers || [])];
  const snapshot = items.slice(0, 8);
  return (
    <div className="ticker-tape" style={{ marginTop: 84 }}>
      <span className="ticker-label">Market snapshot</span>
      <div className="ticker-viewport">
        {items.length ? <div className="ticker-inner">
          <div className="ticker-group">{snapshot.map((s, index) => (
          <button key={`${s.ticker}-${index}`} type="button" className="ticker-item" onClick={() => onSelect(s.ticker)}>
            <span className="ticker-name">{s.ticker?.replace(".NS","")}</span>
            <span className="ticker-price">₹{s.price?.toLocaleString("en-IN")}</span>
            <span className={s.is_positive ? "ticker-change-pos" : "ticker-change-neg"}>
              {s.is_positive ? "▲" : "▼"} {Math.abs(s.change_pct).toFixed(2)}%
            </span>
          </button>
          ))}</div>
          <div className="ticker-group" aria-hidden="true">{snapshot.map((s, index) => (
          <button key={`${s.ticker}-loop-${index}`} type="button" className="ticker-item" onClick={() => onSelect(s.ticker)}>
            <span className="ticker-name">{s.ticker?.replace(".NS","")}</span>
            <span className="ticker-price">â‚¹{s.price?.toLocaleString("en-IN")}</span>
            <span className={s.is_positive ? "ticker-change-pos" : "ticker-change-neg"}>
              {s.is_positive ? "â–²" : "â–¼"} {Math.abs(s.change_pct).toFixed(2)}%
            </span>
          </button>
          ))}</div>
        </div> : <span className="ticker-loading">Loading latest market prices...</span>}
      </div>
    </div>
  );
}

// ── Stock Row ──────────────────────────────────────────────────────────────
function StockRow({ stock, onSelect }) {
  return (
    <div className="stock-row" style={{ cursor: "pointer" }} onClick={() => onSelect && onSelect(stock.ticker)}>
      <div>
        <div className="stock-ticker">{stock.ticker?.replace(".NS", "")}</div>
        <div className="stock-name">{stock.name}</div>
      </div>
      <div style={{ flex: 1 }} />
      <div>
        <div className="stock-price">₹{stock.price?.toLocaleString("en-IN")}</div>
        <div style={{ fontSize: 11, color: "var(--text-muted)", textAlign: "right" }}>
          {stock.change >= 0 ? "+" : ""}{stock.change?.toFixed(2)}
        </div>
      </div>
      <div className={`stock-chg ${stock.is_positive ? "chg-pos" : "chg-neg"}`}>
        {stock.is_positive ? "▲" : "▼"} {Math.abs(stock.change_pct).toFixed(2)}%
      </div>
      <div className="sparkline-wrap">
        <Sparkline data={stock.sparkline} positive={stock.is_positive} width={80} height={30} />
      </div>
    </div>
  );
}

// ── Movers Card ────────────────────────────────────────────────────────────
function MoversCard({ title, tag, tagClass, stocks = [], onSelect }) {
  return (
    <div className="bento-card" style={{ height: "100%" }}>
      <div className={`card-tag ${tagClass}`}>{tag}</div>
      <div className="card-title">{title}</div>
      <div style={{ marginTop: 16 }}>
        {stocks.length === 0
          ? [1,2,3,4,5].map(i => (
              <div key={i} style={{ padding: "10px 0", borderBottom: "1px solid var(--border)" }}>
                <div className="skeleton" style={{ height: 12, width: "60%", marginBottom: 6 }} />
                <div className="skeleton" style={{ height: 10, width: "40%" }} />
              </div>
            ))
          : stocks.map((s, i) => <StockRow key={i} stock={s} onSelect={onSelect} />)
        }
      </div>
    </div>
  );
}

// ── Prediction Demo Card ───────────────────────────────────────────────────
function PredictionDemoCard({ onNavigate }) {
  const demos = [
    { ticker: "RELIANCE", label: "UP", conf: 72, up: 72, down: 15, neutral: 13, color: "var(--green)" },
    { ticker: "HDFCBANK", label: "NEUTRAL", conf: 61, up: 28, down: 18, neutral: 61, color: "#a1a1aa" },
    { ticker: "TCS", label: "DOWN", conf: 67, up: 12, down: 67, neutral: 21, color: "var(--red)" },
  ];
  const [idx, setIdx] = useState(0);
  useEffect(() => {
    const t = setInterval(() => setIdx(i => (i + 1) % demos.length), 3000);
    return () => clearInterval(t);
  }, []);
  const d = demos[idx];
  const predClass = d.label === "UP" ? "pred-up" : d.label === "DOWN" ? "pred-down" : "pred-neutral";
  const bars = [
    { label: "UP",      pct: d.up,      color: "var(--green)" },
    { label: "NEUTRAL", pct: d.neutral, color: "#52525b"      },
    { label: "DOWN",    pct: d.down,    color: "var(--red)"   },
  ];
  return (
    <div className="bento-card" style={{ height: "100%" }}>
      <div className="card-tag tag-purple">AI Prediction</div>
      <div className="card-title">15-Min Forecast</div>
      <div style={{ marginTop: 24, textAlign: "center" }}>
        <div style={{ fontSize: 13, color: "var(--text-muted)", marginBottom: 10 }}>
          <span className="live-dot" /> &nbsp;{d.ticker}.NS
        </div>
        <div className={`pred-badge ${predClass}`} style={{ margin: "0 auto 20px" }}>
          {d.label === "UP" ? "▲" : d.label === "DOWN" ? "▼" : "●"} {d.label}
        </div>
        <div style={{ fontSize: 13, color: "var(--text-muted)", marginBottom: 20 }}>
          Confidence: <strong style={{ color: d.color }}>{d.conf}%</strong>
        </div>
        {bars.map(b => (
          <div key={b.label} className="prob-bar-wrap">
            <div className="prob-bar-label">
              <span style={{ fontSize: 12, color: "var(--text-muted)" }}>{b.label}</span>
              <span style={{ fontSize: 12, fontWeight: 600 }}>{b.pct}%</span>
            </div>
            <div className="prob-bar-track">
              <div className="prob-bar-fill" style={{ width: `${b.pct}%`, background: b.color }} />
            </div>
          </div>
        ))}
        <button className="btn-primary" style={{ width: "100%", marginTop: 24, justifyContent: "center" }}
          onClick={() => onNavigate("predict")}>
          Get Live Prediction →
        </button>
      </div>
    </div>
  );
}

// ── News Sentiment Card ────────────────────────────────────────────────────
function NewsCard() {
  const demoNews = [
    { headline: "RBI keeps repo rate unchanged at 6.5% in MPC meeting", sentiment: 0.3 },
    { headline: "Reliance Industries Q2 profit surges 28% YoY on retail growth", sentiment: 0.72 },
    { headline: "SEBI tightens F&O regulations amid retail trader losses", sentiment: -0.45 },
    { headline: "TCS bags $1.2B multi-year deal with European bank", sentiment: 0.65 },

  return (
    <div className="bento-card" style={{ height: "100%" }}>
      <div className="card-tag tag-amber">Live Sentiment</div>

      <div style={{ marginTop: 16 }}>
        {demoNews.map((n, i) => {
          const cls = n.sentiment > 0.1 ? "sent-pos" : n.sentiment < -0.1 ? "sent-neg" : "sent-neut";

// ── Stats Card ─────────────────────────────────────────────────────────────
function ScoreCard({ scoreboard }) {
  const acc = scoreboard?.overall_accuracy;
  const total = scoreboard?.total_predictions || 0;
  const resolved = scoreboard?.resolved_predictions || 0;
  return (
    <div className="bento-card" style={{ height: "100%" }}>
      <div className="card-tag tag-blue">Model Health</div>
      <div className="card-title">Scoreboard</div>
      <div style={{ display: "flex", gap: 24, marginTop: 24, flexWrap: "wrap" }}>
        <div>
          <div className="big-num gradient-green">{acc != null ? `${(acc * 100).toFixed(1)}%` : "—"}</div>

        </div>
        <div>
          <div className="big-num" style={{ fontSize: 36 }}>{total}</div>
          <div className="big-num-label">Total Predictions</div>
        </div>
        <div>
          <div className="big-num" style={{ fontSize: 36 }}>{resolved}</div>

            style={{ padding: "2px 8px", fontSize: 10 }}>{r.pred_label}</span>

          </span>}

// ── Volume Shockers ────────────────────────────────────────────────────────
function VolumeCard({ stocks = [], onSelect }) {
  return (
    <div className="bento-card" style={{ height: "100%" }}>
      <div className="card-tag tag-purple">Volume</div>
      <div className="card-title">Unusual Activity</div>
      <div style={{ marginTop: 16 }}>
        {stocks.slice(0, 5).map((s, i) => (
          <div key={i} className="stock-row" style={{ cursor: "pointer" }} onClick={() => onSelect?.(s.ticker)}>
            <div style={{ width: 24, color: "var(--text-muted)", fontSize: 12, fontWeight: 700 }}>{i + 1}</div>
            <div style={{ flex: 1 }}>
              <div style={{ fontSize: 13, fontWeight: 700 }}>{s.ticker?.replace(".NS", "")}</div>

              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Search Bar ─────────────────────────────────────────────────────────────
function SearchBar({ universe, onSelect }) {
  const [q, setQ] = useState("");
  const [results, setResults] = useState([]);
  const ref = useRef();

  useEffect(() => {
    const all = [...(universe?.nifty50 || []), ...(universe?.nifty100 || [])];
    const uniq = Array.from(new Map(all.map(x => [x.ticker, x])).values());
    if (!q.trim()) { setResults([]); return; }
    const filt = uniq.filter(x =>
      x.ticker.toLowerCase().includes(q.toLowerCase()) ||
      x.name.toLowerCase().includes(q.toLowerCase())
    ).slice(0, 8);
    setResults(filt);
  }, [q, universe]);

  useEffect(() => {
    const handler = e => { if (!ref.current?.contains(e.target)) setResults([]); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, []);

  return (
    <div className="search-wrap" ref={ref}>
      <svg className="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input className="search-input" placeholder="Search any NIFTY stock… e.g. RELIANCE, HDFC, TCS"
        value={q} onChange={e => setQ(e.target.value)} />
      {results.length > 0 && (
        <div className="search-results">
          {results.map((r, i) => (
            <div key={i} className="search-result-item" onClick={() => { onSelect(r.ticker); setQ(""); setResults([]); }}>
              <div>
                <div style={{ fontSize: 13, fontWeight: 700 }}>{r.ticker.replace(".NS","")}</div>
                <div style={{ fontSize: 12, color: "var(--text-muted)" }}>{r.name}</div>
              </div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" strokeWidth="2">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  const features = [
    { icon: "🧠", bg: "var(--purple-dim)", title: "LightGBM Model", desc: "Walk-forward trained on 5-min OHLCV bars with 28K+ purged rows and class-balanced weights." },
    { icon: "📰", bg: "rgba(245,158,11,0.1)", title: "Live News Sentiment", desc: "FinBERT or lexicon fallback scores Google News headlines and shifts probability mass in real time." },
    { icon: "📈", bg: "var(--blue-dim)", title: "15-Min Horizon", desc: "Predicts UP / DOWN / NEUTRAL over the next 3 five-minute bars with volatility-adaptive thresholds." },
    { icon: "🔁", bg: "var(--green-dim)", title: "Replay Mode", desc: "Step through any historical date with strict zero-lookahead guarantees — no future data ever leaks." },
    { icon: "🎯", bg: "var(--red-dim)", title: "Scoreboard", desc: "Automated resolution of predictions after the horizon elapses. Track live accuracy over time." },
    { icon: "🏦", bg: "rgba(255,255,255,0.05)", title: "NIFTY 100 Universe", desc: "Full NIFTY 50 & 100 coverage. Validated tickers, batch downloads, and SQLite caching." },
  ];
  return (
    <section className="section">
      <div className="section-label">How it works</div>
      <div className="section-title">
        Built on <span className="gradient-green">real signal</span>,<br />not noise.
      </div>

// ── Technical Indicator Helpers ─────────────────────────────────────────────
function computeVWAP(candles, volumes) {
  // Reset per trading day — group by date prefix
  let cumTP = 0, cumVol = 0;
  let lastDay = null;
  return candles.map((c, i) => {
    const day = c.t ? c.t.substring(0, 10) : null;
    if (day !== lastDay) { cumTP = 0; cumVol = 0; lastDay = day; }
    const tp = (c.h + c.l + c.c) / 3;
    const v  = volumes?.[i]?.v || 0;
    cumTP  += tp * v;
    cumVol += v;
    return cumVol > 0 ? cumTP / cumVol : c.c;
  });
}

function computeEMA(closes, period) {
  const k = 2 / (period + 1);
  const result = new Array(closes.length).fill(null);
  let ema = closes[0];
  for (let i = 0; i < closes.length; i++) {
    if (i === 0) { result[i] = closes[0]; continue; }
    ema = closes[i] * k + ema * (1 - k);
    result[i] = ema;
  }
  return result;
}

function computeBB(closes, period = 20, mult = 2) {
  const upper = [], mid = [], lower = [];
  for (let i = 0; i < closes.length; i++) {
    if (i < period - 1) { upper.push(null); mid.push(null); lower.push(null); continue; }
    const slice = closes.slice(i - period + 1, i + 1);
    const sma = slice.reduce((a, b) => a + b, 0) / period;
    const std = Math.sqrt(slice.reduce((a, b) => a + (b - sma) ** 2, 0) / period);
    upper.push(sma + mult * std);
    mid.push(sma);
    lower.push(sma - mult * std);
  }
  return { upper, mid, lower };
}

          </div>
        </div>
      </div>
    </div>
  );
}

// ── Scoreboard Page ────────────────────────────────────────────────────────
function ScoreboardPage({ onNavigate }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    api("/api/scoreboard").then(d => { setData(d); setLoading(false); }).catch(() => setLoading(false));
  }, []);

  return (
    <div style={{ paddingTop: 80, maxWidth: 1200, margin: "0 auto", padding: "100px 32px 60px" }}>
      <button onClick={() => onNavigate("landing")}
        style={{ color: "var(--text-muted)", background: "none", border: "none", cursor: "pointer", fontSize: 13, marginBottom: 24, display: "flex", alignItems: "center", gap: 6 }}>
        ← Back to Home
      </button>
      <h1 style={{ fontSize: 42, fontWeight: 900, letterSpacing: -1.5, marginBottom: 8 }}>Model Scoreboard</h1>
      <p style={{ color: "var(--text-muted)", marginBottom: 40 }}>Automated resolution of predictions after the 15-minute horizon elapses.</p>

      {loading ? <div className="skeleton" style={{ height: 200, borderRadius: 16 }} /> : (
        <>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 16, marginBottom: 32 }}>
            {[
              { label: "Overall Accuracy", value: data?.overall_accuracy != null ? `${(data.overall_accuracy * 100).toFixed(1)}%` : "—", color: "var(--green)" },
              { label: "Total Predictions", value: data?.total_predictions || 0 },
              { label: "Resolved", value: data?.resolved_predictions || 0 },
            ].map((s, i) => (
              <div key={i} className="bento-card">
                <div style={{ fontSize: 12, color: "var(--text-muted)", marginBottom: 8, textTransform: "uppercase", letterSpacing: 0.5 }}>{s.label}</div>
                <div style={{ fontSize: 40, fontWeight: 900, letterSpacing: -1.5, color: s.color || "var(--text)" }}>{s.value}</div>
              </div>
            ))}
          </div>
          <div className="bento-card">
            <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 16 }}>Recent Predictions</div>
            {data?.recent?.length === 0 && <div style={{ color: "var(--text-muted)", fontSize: 13 }}>No resolved predictions yet. Make a few predictions and come back!</div>}
            {(data?.recent || []).map((r, i) => (
              <div key={i} style={{ display: "flex", alignItems: "center", gap: 14, padding: "12px 0",
                borderBottom: "1px solid var(--border)", fontSize: 13 }}>
                <span style={{ fontWeight: 700, minWidth: 90 }}>{r.ticker?.replace(".NS","")}</span>
                <span style={{ color: "var(--text-muted)", fontSize: 11 }}>{r.made_at?.slice(0,16)}</span>
                <span className={`pred-badge ${r.pred_label === "UP" ? "pred-up" : r.pred_label === "DOWN" ? "pred-down" : "pred-neutral"}`}
                  style={{ padding: "2px 10px", fontSize: 11 }}>
                  Predicted: {r.pred_label}
                </span>
                {r.actual_label && (
                  <span style={{ color: r.correct ? "var(--green)" : "var(--red)", fontWeight: 700 }}>
                    {r.correct ? "✓ Correct" : "✗ Wrong"} → {r.actual_label}
                  </span>
                )}
                <span style={{ marginLeft: "auto", fontSize: 12, fontWeight: 600 }}>
                  {(r.confidence * 100).toFixed(0)}% conf
                </span>
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// ── Root App ───────────────────────────────────────────────────────────────
function App() {
  const [page, setPage]           = useState("landing");
  const [status, setStatus]       = useState(null);
  const [movers, setMovers]       = useState(null);
  const [universe, setUniverse]   = useState(null);
  const [scoreboard, setScoreboard] = useState(null);
  const [selectedTicker, setSelectedTicker] = useState("RELIANCE.NS");

  useEffect(() => {
    // Load market status and universe immediately (fast)
    api("/api/market_status").then(setStatus).catch(() => {});
    api("/api/universe").then(setUniverse).catch(() => {});
    api("/api/scoreboard").then(setScoreboard).catch(() => {});
    // Movers can be slow (yfinance batch)
    api("/api/movers?universe=nifty50").then(setMovers).catch(() => {});
    // Refresh market status every 30s
    const timer = setInterval(() => api("/api/market_status").then(setStatus).catch(() => {}), 30000);
    return () => clearInterval(timer);
  }, []);

  const navigate = (pg) => setPage(pg);
  const selectStock = (ticker) => { setSelectedTicker(ticker); setPage("predict"); };

  return (
    <>
      <Nav status={status} onNavigate={navigate} />
      {page === "landing" && (
        <LandingPage status={status} movers={movers} universe={universe} scoreboard={scoreboard}
          onNavigate={navigate} onSelectStock={selectStock} />
      )}
      {page === "predict" && (
        <PredictionPage universe={universe} onNavigate={navigate} initialTicker={selectedTicker} />
      )}
      {page === "scoreboard" && <ScoreboardPage onNavigate={navigate} />}

      {/* Disclaimer */}
      <div className="disclaimer">
        ⚠️ <strong>Disclaimer:</strong> PulsePredict is for educational purposes only. Predictions are generated by an ML model and do not constitute financial advice. Past accuracy does not guarantee future results. Never invest based solely on model outputs.
      </div>

      {/* Footer */}
      <footer className="footer" style={{ maxWidth: "100%", padding: "32px" }}>
        <div className="footer-logo">PulsePredict</div>
        <div className="footer-note">© 2024 · NSE Intraday Intelligence · Educational use only · Free & open source</div>
      </footer>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
